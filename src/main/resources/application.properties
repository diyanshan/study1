spring.application.name=study1

# ==================== MySQL（Docker 容器：study1-mysql） ====================
# 连接串可通过环境变量覆盖：MYSQL_URL / MYSQL_USER / MYSQL_PASSWORD
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/study1?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 连接池（HikariCP，Spring Boot 默认）
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# ==================== JPA / Hibernate ====================
# 开发期由实体自动建表/更新表结构；生产建议改为 none 并用 migrate 工具管理
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 关闭 OSIV，避免 Web 层持有 Session
spring.jpa.open-in-view=false

# 启动时打印数据库信息，方便确认连到了容器里
spring.jpa.properties.hibernate.generate_statistics=false

# ==================== Web ====================
server.port=8080

# ==================== 排查用配置 ====================
# 报错时把异常信息带进响应体，否则 500 只有一个空 body，看不出原因
# 上线前建议删掉这两行，避免把内部细节暴露给外部
server.error.include-message=always
server.error.include-stacktrace=on_param

# Tomcat 访问日志：记录每个进来的请求(方法/路径/状态码/耗时)
# 排查"到底有没有请求打到应用上"最有效
# 注意两点：
#   1) directory 默认相对 Tomcat 临时基目录，必须写 ${user.dir} 才会落在项目里
#   2) 按天切分，实际文件名形如 logs/access.2026-09-22.log
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=${user.dir}/logs
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%t %a "%r" %s %b %Dms
